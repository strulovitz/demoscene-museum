<!DOCTYPE html>
<!-- shared/web/examples/fm.html : python -m http.server 8000  then
     http://localhost:8000/shared/web/examples/fm.html  -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FM synth test</title>
</head>
<body style="background:#111;color:#ddd;font-family:sans-serif;padding:2rem">
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <label> tempo <input id="bpm" type="range" min="60" max="200" value="125"></label>
  <label> lead brightness <input id="mod" type="range" min="0" max="8" step="0.1" value="1.5"></label>
  <div id="pos"></div>
  <script type="module">
    import { startAudio } from '../audio-host.js';

    let audio = null;
    document.getElementById('start').onclick = async () => {
      audio = await startAudio(new URL('./fm-audio.js', import.meta.url).href);
      document.getElementById('start').disabled = true;
      document.getElementById('stop').disabled = false;
      (function show() {                       // the sequencer position, 30 times a second
        if (!audio) return;
        document.getElementById('pos').textContent = audio.position ? 'step ' + audio.position.step : '';
        requestAnimationFrame(show);
      })();
    };
    document.getElementById('stop').onclick = async () => {
      await audio.stop(); audio = null;
      document.getElementById('start').disabled = false;
      document.getElementById('stop').disabled = true;
    };
    document.getElementById('bpm').oninput = e => audio && audio.setParam('BPM', Number(e.target.value));
    document.getElementById('mod').oninput = e => audio && audio.setParam('LEAD_MOD_INDEX', Number(e.target.value));
  </script>
</body>
</html>
