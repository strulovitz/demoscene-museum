<!DOCTYPE html>
<!-- shared/web/examples/mod.html : open via  python -m http.server 8000  then
     http://localhost:8000/shared/web/examples/mod.html  -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MOD player test</title>
</head>
<body style="background:#111;color:#ddd;font-family:monospace;padding:2rem">
  <button id="start">Start (built-in test song)</button>
  <button id="stop" disabled>Stop</button>
  <label> open a .mod file: <input id="file" type="file" accept=".mod" disabled></label>
  <label> tempo <input id="bpm" type="range" min="60" max="240" value="125"></label>
  <pre id="pos"></pre>
  <script type="module">
    import { startAudio } from '../audio-host.js';
    let audio = null;
    const el = id => document.getElementById(id);
    el('start').onclick = async () => {
      audio = await startAudio(new URL('./mod-audio.js', import.meta.url).href);
      el('start').disabled = true;
      el('stop').disabled = false;
      el('file').disabled = false;
      (function show() {                                // the player position, 30 times a second
        if (!audio) return;
        const p = audio.position;
        if (p) el('pos').textContent =
          `"${p.title}"   order ${p.order}  pattern ${p.pattern}  row ${String(p.row).padStart(2)}   speed ${p.speed}  bpm ${p.bpm}\n` +
          p.channels.map((c, i) => `ch${i + 1}: sample ${String(c.sample).padStart(2)}  vol ${String(c.volume).padStart(2)}  ` +
                                   '#'.repeat(Math.round(c.volume / 4))).join('\n');
        requestAnimationFrame(show);
      })();
    };
    el('stop').onclick = async () => {
      await audio.stop(); audio = null;
      el('start').disabled = false;
      el('stop').disabled = true;
      el('file').disabled = true;
    };
    el('file').onchange = async (e) => {                 // the page reads the file; the worklet cannot
      const buffer = await e.target.files[0].arrayBuffer();
      audio.setParam('MOD_DATA', buffer);
    };
    el('bpm').oninput = e => audio && audio.setParam('BPM', Number(e.target.value));
  </script>
</body>
</html>
